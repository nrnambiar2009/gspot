[package]
name = "grammarlama"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "GSpot — a local-first Grammarly-style writing assistant for macOS and Linux"
license = "MIT"

[lib]
name = "grammarlama_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
harper-core = "2"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"
arboard = "3"
tiny_http = "0.12"
dirs = "5"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
scraper = "0.21"
unicode-segmentation = "1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSEvent", "NSScreen", "NSApplication", "NSResponder", "NSWindow", "NSGraphics"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSGeometry", "NSProcessInfo"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
